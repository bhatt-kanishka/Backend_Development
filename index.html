<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EndpointCraft — Backend Development</title>
  <meta name="description" content="EndpointCraft: Kanishka Bhatt's Backend Development coursework documentation — Labs, Theory, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

<body>

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">EndpointCraft</span>
      </div>

    <div class="sidebar-profile">

        <div class="profile-name">Kanishka Bhatt</div>
        <div class="profile-role">Backend Developer</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <a href="#home" class="nav-item active" data-section="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Dashboard</span>
      </a>

      <div class="nav-group">
        <a href="#labs" class="nav-item nav-parent" data-section="labs">
          <span class="nav-icon">🧪</span>
          <span class="nav-label">Labs</span>
          <span class="nav-chevron">›</span>
        </a>
        <div class="nav-children" id="labsNav"></div>
      </div>

      <div class="nav-group">
        <a href="#theory" class="nav-item nav-parent" data-section="theory">
          <span class="nav-icon">📖</span>
          <span class="nav-label">Theory</span>
          <span class="nav-chevron">›</span>
        </a>
        <div class="nav-children" id="theoryNav"></div>
      </div>

      <a href="#course-plan" class="nav-item" data-section="course-plan">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Course Plan</span>
      </a>

      <a href="#syllabus" class="nav-item" data-section="syllabus">
        <span class="nav-icon">📄</span>
        <span class="nav-label">Syllabus</span>
      </a>

      <a href="#index" class="nav-item" data-section="index">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">Index</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="https://github.com/bhatt-kanishka/Backend_Development" target="_blank" rel="noopener" class="nav-item github-link">
        <span class="nav-icon">📦</span>
        <span class="nav-label">GitHub Repo</span>
      </a>
    </div>
  </aside>

  <div class="main-wrapper">

    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <h1 class="greeting">HELLO, KANISHKA!</h1>
      </div>
      <div class="topbar-right">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="Search labs, theory, files...">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="topbar-badge" title="EndpointCraft">⚡</div>
      </div>
    </header>

    <!-- Breadcrumbs -->
    <div class="breadcrumbs" id="breadcrumbs"></div>

    <!-- Main Content Area -->
    <main class="content" id="content">
      <!-- Dynamic content rendered here by app.js -->
    </main>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
